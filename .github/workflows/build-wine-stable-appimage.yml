name: Build Wine Stable AppImage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Wine AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl tar squashfs-tools file fuse libfuse2 zstd binutils

      - name: Setup WineHQ Repository and Install Wine Stable
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/jammy/winehq-jammy.sources
          sudo apt-get update
          sudo apt-get install -y --install-recommends winehq-stable

      - name: Copy Wine Stable to AppDir and Download Components (DXVK, VKD3D, Wine Mono)
        run: |
          mkdir -p appdir/opt
          cp -r /opt/wine-stable appdir/opt/

          mkdir -p appdir/usr/share/wine-components

          DXVK_URL=$(curl -s https://api.github.com/repos/doitsujin/dxvk/releases/latest | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
          wget -O dxvk.tar.gz "$DXVK_URL"
          mkdir -p appdir/usr/share/wine-components/dxvk
          tar -xf dxvk.tar.gz -C appdir/usr/share/wine-components/dxvk --strip-components=1
          rm dxvk.tar.gz

          VKD3D_URL=$(curl -s https://api.github.com/repos/HansKristian-Work/vkd3d-proton/releases/latest | grep "browser_download_url.*tar.zst" | cut -d '"' -f 4 | head -n 1)
          if [ -z "$VKD3D_URL" ]; then
            VKD3D_URL=$(curl -s https://api.github.com/repos/HansKristian-Work/vkd3d-proton/releases/latest | grep "browser_download_url.*tar.tar.zst" | cut -d '"' -f 4 | head -n 1)
          fi
          wget -O vkd3d.tar.zst "$VKD3D_URL"
          mkdir -p appdir/usr/share/wine-components/vkd3d-proton
          tar -I zstd -xf vkd3d.tar.zst -C appdir/usr/share/wine-components/vkd3d-proton --strip-components=1
          rm vkd3d.tar.zst

          MONO_URL=$(curl -s https://api.github.com/repos/wine-mono/wine-mono/releases/latest | grep "browser_download_url.*x86.msi" | cut -d '"' -f 4 | head -n 1)
          wget -O wine-mono.msi "$MONO_URL"
          mkdir -p appdir/usr/share/wine-components/mono
          mv wine-mono.msi appdir/usr/share/wine-components/mono/

      - name: Strip Debug Symbols from Wine Binaries and DLLs
        run: |
          find appdir/opt/wine-stable -type f \( -name "*.so" -o -name "*.dll" -o -name "*.exe" -o -executable \) -exec strip --strip-unneeded {} + 2>/dev/null || true

      - name: Download go-appimage tool
        run: |
          mkdir -p bin
          wget -c https://github.com/$(wget -q https://github.com/probonopd/go-appimage/releases/expanded_assets/continuous -O - | grep "appimagetool-.*-x86_64.AppImage" | head -n 1 | cut -d '"' -f 2) -O bin/appimagetool
          chmod +x bin/appimagetool

      - name: Create AppDir Metadata and AppRun
        run: |
          cat << 'EOF' > appdir/wine-stable.desktop
          [Desktop Entry]
          Type=Application
          Name=Wine Stable
          Exec=AppRun
          Icon=wine
          Categories=Utility;
          EOF

          mkdir -p appdir/usr/share/icons/hicolor/scalable/apps/
          touch appdir/wine.svg

          cat << 'EOF' > appdir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
          export APPIMAGE_PATH="${APPIMAGE:-$(readlink -f "$0")}"
          APPIMAGE_DIR="$(dirname "$APPIMAGE_PATH")"
          APPS_DIR="$HOME/.local/share/applications"

          export PATH="$HERE/opt/wine-stable/bin:$PATH"
          export WINEPREFIX="${WINEPREFIX:-$HOME/.wine}"

          if [[ "$1" == "--install" ]]; then
              mkdir -p "$APPS_DIR"

              cat <<EOT > "$APPS_DIR/wine-stable-runner.desktop"
          [Desktop Entry]
          Name=Wine Stable Launcher
          Exec="$APPIMAGE_PATH" %f
          Icon=wine
          Type=Application
          Terminal=false
          Categories=Utility;
          MimeType=application/x-ms-dos-executable;application/x-msi;application/x-msdownload;
          EOT

              cat <<EOT > "$APPS_DIR/wine-stable-explorer.desktop"
          [Desktop Entry]
          Name=Wine Stable Explorer
          Exec="$APPIMAGE_PATH" explorer
          Icon=folder-wine
          Type=Application
          Terminal=false
          Categories=Utility;
          EOT

              cat <<EOT > "$APPS_DIR/wine-stable-winecfg.desktop"
          [Desktop Entry]
          Name=Wine Stable Winecfg
          Exec="$APPIMAGE_PATH" winecfg
          Icon=wine-winecfg
          Type=Application
          Terminal=false
          Categories=Utility;
          EOT

              cat <<EOT > "$APPS_DIR/wine-stable-reboot.desktop"
          [Desktop Entry]
          Name=Wine Stable Reboot (Kill)
          Exec="$APPIMAGE_PATH" wineboot -k
          Icon=folder-wine
          Type=Application
          Terminal=false
          Categories=Utility;
          EOT

              cat <<EOT > "$APPS_DIR/wine-stable-control.desktop"
          [Desktop Entry]
          Name=Wine Stable Control Panel
          Exec="$APPIMAGE_PATH" control
          Icon=preferences-system
          Type=Application
          Terminal=false
          Categories=Utility;
          EOT

              chmod +x "$APPS_DIR"/wine-stable-*.desktop

              xdg-mime default wine-stable-runner.desktop application/x-ms-dos-executable
              xdg-mime default wine-stable-runner.desktop application/x-msi
              xdg-mime default wine-stable-runner.desktop application/x-msdownload

              update-desktop-database "$APPS_DIR" 2>/dev/null
              exit 0

          elif [[ "$1" == "--uninstall" ]]; then
              for mime in application/x-ms-dos-executable application/x-msi application/x-msdownload; do
                  current_default=$(xdg-mime query default "$mime")
                  if [[ "$current_default" == "wine-stable-runner.desktop" ]]; then
                      sed -i "/$mime=wine-stable-runner.desktop/d" "$HOME/.config/mimeapps.list" 2>/dev/null || true
                  fi
              done

              rm -f "$APPS_DIR/wine-stable-runner.desktop" \
                    "$APPS_DIR/wine-stable-explorer.desktop" \
                    "$APPS_DIR/wine-stable-winecfg.desktop" \
                    "$APPS_DIR/wine-stable-reboot.desktop" \
                    "$APPS_DIR/wine-stable-control.desktop"

              update-desktop-database "$APPS_DIR" 2>/dev/null
              exit 0
          fi

          if [ ! -d "$WINEPREFIX" ]; then
              WINEDLLOVERRIDES="mscoree=d" wineboot --init

              if [ -d "$HERE/usr/share/wine-components/mono" ]; then
                  MONO_MSI=$(find "$HERE/usr/share/wine-components/mono" -name "*.msi" | head -n 1)
                  if [ -f "$MONO_MSI" ]; then
                      wine msiexec /i "$MONO_MSI" /norestart
                  fi
              fi

              if [ -d "$HERE/usr/share/wine-components/dxvk" ]; then
                  cp -r "$HERE/usr/share/wine-components/dxvk/x64/"* "$WINEPREFIX/drive_c/windows/system32/" 2>/dev/null || true
                  cp -r "$HERE/usr/share/wine-components/dxvk/x32/"* "$WINEPREFIX/drive_c/windows/syswow64/" 2>/dev/null || true
              fi

              if [ -d "$HERE/usr/share/wine-components/vkd3d-proton" ]; then
                  cp -r "$HERE/usr/share/wine-components/vkd3d-proton/x64/"* "$WINEPREFIX/drive_c/windows/system32/" 2>/dev/null || true
                  cp -r "$HERE/usr/share/wine-components/vkd3d-proton/x86/"* "$WINEPREFIX/drive_c/windows/syswow64/" 2>/dev/null || true
              fi

              wine reg add "HKEY_CURRENT_USER\Software\Wine\DllOverrides" /v d3d11 /t REG_SZ /d native,builtin /f >/dev/null 2>&1
              wine reg add "HKEY_CURRENT_USER\Software\Wine\DllOverrides" /v dxgi /t REG_SZ /d native,builtin /f >/dev/null 2>&1
              wine reg add "HKEY_CURRENT_USER\Software\Wine\DllOverrides" /v d3d10 /t REG_SZ /d native,builtin /f >/dev/null 2>&1
              wine reg add "HKEY_CURRENT_USER\Software\Wine\DllOverrides" /v d3d10core /t REG_SZ /d native,builtin /f >/dev/null 2>&1
              wine reg add "HKEY_CURRENT_USER\Software\Wine\DllOverrides" /v d3d9 /t REG_SZ /d native,builtin /f >/dev/null 2>&1
              wine reg add "HKEY_CURRENT_USER\Software\Wine\DllOverrides" /v d3d12 /t REG_SZ /d native,builtin /f >/dev/null 2>&1
              wine reg add "HKEY_CURRENT_USER\Software\Wine\DllOverrides" /v d3d12core /t REG_SZ /d native,builtin /f >/dev/null 2>&1
          fi

          if [ -z "$1" ]; then
              if python3 -c "import tkinter" &>/dev/null; then
                  python3 - << 'PY_EOF'
          import os
          import subprocess
          import sys
          import tkinter as tk
          from tkinter import messagebox

          appimage = os.getenv("APPIMAGE_PATH")

          def execute(args):
              try:
                  if appimage:
                      subprocess.Popen([appimage] + args)
                  else:
                      subprocess.Popen(["wine"] + args)
              except Exception as e:
                  messagebox.showerror("Error", f"Failed to execute command: {e}")

          root = tk.Tk()
          root.title("Wine Stable")
          root.geometry("340x400")
          root.resizable(False, False)

          frame = tk.Frame(root, padx=15, pady=15)
          frame.pack(fill="both", expand=True)

          label = tk.Label(frame, text="Wine Stable Runner Options", font=("Helvetica", 11, "bold"))
          label.pack(pady=(0, 10))

          buttons = [
              ("Launch Wine Explorer", lambda: execute(["explorer"])),
              ("Launch Winecfg", lambda: execute(["winecfg"])),
              ("Launch regedit", lambda: execute(["regedit"])),
              ("Kill Wine (wineboot -k)", lambda: execute(["wineboot", "-k"])),
              ("Install MIME Integration", lambda: execute(["--install"])),
              ("Uninstall MIME Integration", lambda: execute(["--uninstall"])),
          ]

          for text, cmd in buttons:
              btn = tk.Button(frame, text=text, command=cmd, width=30, pady=5)
              btn.pack(pady=5)

          root.mainloop()
          PY_EOF
                  exit 0
              else
                  set -- "explorer"
              fi
          fi

          if [ -f "$1" ]; then
              REAL_PATH=$(readlink -f "$1")
              shift
              set -- "$REAL_PATH" "$@"
          fi

          exec wine "$@"
          EOF
          chmod +x appdir/AppRun

      - name: Build AppImage with go-appimage
        run: |
          export ARCH=x86_64
          export VERSION=11.0.0
          ./bin/appimagetool appdir

      - name: Upload AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.AppImage
          tag_name: v11.0.0
          name: Wine Stable v11.0.0
          body: ""
          draft: false
          prerelease: false
